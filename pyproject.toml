[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-sandbox-syscall-filter"
version = "0.1.0"
description = "In-process seccomp and syscall emulator restricting agent Python scripts from unauthorized socket and file access"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
python-sandbox-syscall-filter = "python_sandbox_syscall_filter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["python_sandbox_syscall_filter*"]
